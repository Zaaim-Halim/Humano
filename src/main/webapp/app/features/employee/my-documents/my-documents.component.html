<div class="hum-page">
  <hum-page-header [title]="'humano.myDocuments.title' | translate" [subtitle]="'humano.myDocuments.subtitle' | translate" />

  @if (!resolved()) {
    <div style="display: grid; gap: var(--space-3)"><hum-skeleton-row /><hum-skeleton-row /><hum-skeleton-row /></div>
  } @else if (employeeId(); as id) {
    <hum-document-library [employeeId]="id" />
  } @else {
    <hum-alert tone="info" [title]="'humano.myDocuments.noProfileTitle' | translate">
      {{ 'humano.myDocuments.noProfileBody' | translate }}
    </hum-alert>
  }
</div>
