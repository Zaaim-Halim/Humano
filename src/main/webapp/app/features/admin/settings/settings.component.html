<div class="hum-page">
  <hum-page-header [title]="'humano.settings.title' | translate" [subtitle]="'humano.settings.subtitle' | translate" />

  <div class="hum-settings">
    <nav class="hum-settings__nav" [attr.aria-label]="'humano.settings.title' | translate">
      @for (s of sections; track s.id) {
        <a
          class="hum-settings__link"
          [class.is-active]="active() === s.id"
          [routerLink]="['/settings', s.id]"
          [attr.aria-current]="active() === s.id ? 'page' : null"
        >
          <span class="hum-records__icon"><lucide-icon [name]="s.icon" [size]="16" /></span>
          <span>
            <strong>{{ 'humano.settings.section.' + s.id + '.title' | translate }}</strong>
            <small>{{ 'humano.settings.section.' + s.id + '.hint' | translate }}</small>
          </span>
        </a>
      }
    </nav>

    <div class="hum-settings__body">
      @switch (active()) {
        @case ('company') {
          <hum-company-settings />
        }
        @case ('payroll') {
          <hum-payroll-settings />
        }
        @case ('lists') {
          <hum-lists-settings />
        }
        @case ('access') {
          <hum-access-settings />
        }
      }
    </div>
  </div>
</div>
