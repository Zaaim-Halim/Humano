<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.billing.trial-ended.title}">Trial ended</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <p th:text="#{email.billing.trial-ended.greeting(${tenantName})}">Hi,</p>
    <p th:text="#{email.billing.trial-ended.body}">Your trial ended; the workspace is read-only.</p>
    <p th:text="#{email.billing.trial-ended.until(${readOnlyUntil}, ${retentionDays})}">Pick a plan before the date.</p>
    <p>
      <a th:with="url=(@{|${baseUrl}/settings/billing|})" th:href="${url}" th:text="${url}">Choose a plan</a>
    </p>
    <p>
      <span th:text="#{email.billing.text2}">Regards,</span>
      <br />
      <em th:text="#{email.signature}">Humano Team.</em>
    </p>
  </body>
</html>
