name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The release check from docs/go-to-market.md: frontend lint and tests, backend unit and
      # integration tests, and the production build. Maven installs its own Node (pom.xml).
      - run: ./mvnw -ntp -B -Pprod verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/test-results/
          retention-days: 7
